version: "3"
services:
  db:
    image: mysql:8.0.26
    restart: always
    command:
      - --lower_case_table_names=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
    container_name: codehansabari-db
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - TZ=${TZ}
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      retries: 10
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    networks:
      - app-network

  redis:
    image: redis:latest
    container_name: codehansabari-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    restart: always
    networks:
      - app-network

  grafana-agent:
    image: grafana/agent:latest
    container_name: codehansabari-grafana-agent
    command:
      - --config.file=/etc/agent/agent.yml
      - --config.expand-env
      - --server.http.address=0.0.0.0:12345
    volumes:
      - ./agent.yml:/etc/agent/agent.yml:ro
    ports:
      - "12345:12345"
    restart: unless-stopped
    environment:
      - GRAFANA_PUSH_URL=${GRAFANA_PUSH_URL}
      - GRAFANA_USERNAME=${GRAFANA_USERNAME}
      - GRAFANA_PASSWORD=${GRAFANA_PASSWORD}

networks:
  app-network:
    driver: bridge