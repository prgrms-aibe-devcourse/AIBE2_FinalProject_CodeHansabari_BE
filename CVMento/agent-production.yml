server:
  log_level: info
  http_listen_port: 12345

metrics:
  global:
    scrape_interval: 30s
    external_labels:
      environment: production
      service: cvmento
  configs:
    - name: cvmento-production
      scrape_configs:
        - job_name: 'spring-boot-app'
          static_configs:
            - targets: ['localhost:5000']  # production 포트
          metrics_path: '/actuator/prometheus'
          scrape_interval: 30s
          scrape_timeout: 10s
          honor_labels: true

        - job_name: 'grafana-agent'
          static_configs:
            - targets: ['localhost:12345']
          metrics_path: '/metrics'
          scrape_interval: 30s

      remote_write:
        - url: ${GRAFANA_PUSH_URL}
          basic_auth:
            username: ${GRAFANA_USERNAME}
            password: ${GRAFANA_PASSWORD}
          queue_config:
            max_samples_per_send: 1000
            max_shards: 200
            capacity: 2500