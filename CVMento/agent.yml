server:
  log_level: info

metrics:
  global:
    scrape_interval: 30s
    external_labels:
      environment: local
      service: cvmento
  configs:
    - name: cvmento-local
      scrape_configs:
        - job_name: 'spring-boot-app'
          static_configs:
            - targets: ['host.docker.internal:8080']  # 로컬 개발 포트
          metrics_path: '/actuator/prometheus'
          scrape_interval: 30s
          scrape_timeout: 10s

        - job_name: 'grafana-agent'
          static_configs:
            - targets: ['localhost:12345']
          metrics_path: '/metrics'
          scrape_interval: 30s

      remote_write:
        - url: ${GRAFANA_PUSH_URL}
          basic_auth:
            username: ${GRAFANA_USERNAME}
            password: ${GRAFANA_PASSWORD}
          queue_config:
            max_samples_per_send: 1000
            max_shards: 200
            capacity: 2500