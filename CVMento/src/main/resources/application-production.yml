spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
    properties:
      hibernate:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      repositories:
        enabled: false
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: https://api.cvmento.shop/login/oauth2/code/google
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

cookie:
  domain: .cvmento.shop
  secure: true
  same-site: None

app:
  frontend:
    url: https://cvmento.shop
  cors:
    allowed-origins:
      - "https://cvmento.shop"

llm:
  api:
    url: https://api.openai.com/v1
    cover-letter:
      key: ${LLM_COVER_LETTER_KEY}
    interview:
      key: ${LLM_INTERVIEW_KEY}
    resume:
      key: ${LLM_RESUME_KEY}
      vision:
        key: ${LLM_RESUME_VISION_KEY}

gemini:
  api:
    feature-extraction:
      url: https://generativelanguage.googleapis.com/v1beta
      key: ${GEMINI_API_KEY}

# 임베딩 모델 설정
embedding:
  model:
    url: "djl://ai.djl.huggingface.pytorch/sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
    threshold: 0.75
  cache:
    dir: "${user.home}/.djl-cache"

logging:
  config: classpath:logback-spring.xml
  level:
    com.cvmento: INFO
    ca.pjer.logback: WARN
    org.hibernate: WARN
    org.springframework: WARN
    root: ERROR

server:
  port: 5000

cloud:
  aws:
    region:
      static: ap-northeast-2
    lambda:
      function-name: aibe2-team2-resume-ocr-function

resume:
  import:
    strategy: lambda

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    web:
      server:
        request:
          autotime:
            enabled: true
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
      percentiles:
        http:
          server:
            requests: 0.5,0.95,0.99
    tags:
      application: cvmento
      environment: production