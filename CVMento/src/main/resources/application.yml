spring:
  application:
    name: backend
  profiles:
    active: local  # 기본 프로파일
  jackson:
    time-zone: Asia/Seoul

  # 공통 설정
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
  cloud:
    openfeign:
      client:
        config:
          llm-client:
            connect-timeout: 60000
            read-timeout: 60000
          sub-backend-job: # JobClient용
            connect-timeout: 5000
            read-timeout: 180000
          sub-backend-feature: # FeatureClient용
            connect-timeout: 5000
            read-timeout: 180000
          sub-backend-crawl: # CrawlClient용
            connect-timeout: 5000
            read-timeout: 180000
          sub-backend-status:
            connect-timeout: 5000
            read-timeout: 180000
          sub-backend-test:
            connect-timeout: 5000
            read-timeout: 180000

redis:
  keys:
    refresh-token: "refresh_token:"
    blacklist: "blacklist:"
    user-session: "user_session:"

springdoc:
  api-docs:
    version: openapi_3_0