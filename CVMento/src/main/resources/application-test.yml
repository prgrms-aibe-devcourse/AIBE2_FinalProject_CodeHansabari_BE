spring:
  datasource:
    url: jdbc:mysql://localhost:3309/aibe2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true  # 테스트에서 SQL 로그 보기
    hibernate:
      ddl-auto: update  # MySQL이므로 update로 변경
    database-platform: org.hibernate.dialect.MySQL8Dialect  # MySQL 방언으로 변경
    defer-datasource-initialization: true
  sql:
    init:
      mode: never
  data:
    redis:
      host: localhost
      port: 6381
      password: team2
      timeout: 2000ms
  cloud:
    openfeign:
      enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy-test-client-id
            client-secret: dummy-test-client-secret
            scope:
              - openid
              - profile
              - email

jwt:
  secret: test-jwt-secret-for-testing-only-not-for-production-use
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

cookie:
  domain: localhost
  secure: false
  same-site: Lax

app:
  frontend:
    url: http://localhost:3000
  cors:
    allowed-origins:
      - "http://localhost:3000"

llm:
  api:
    url: https://api.openai.com/v1
    cover-letter:
      key: dummy-test-key-cover-letter
    interview:
      key: dummy-test-key-interview
    resume:
      key: dummy-test-key-resume
      vision:
        key: dummy-test-key-vision

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId},%X{spanId},%X{userEmail},%X{responseTime},%X{statusCode}] %logger{36} - %msg%n"
  level:
    com.cvmento: INFO  # 벤치마크 중에는 INFO 레벨로
    org.springframework.security: WARN
    org.springframework.data.redis: WARN

server:
  port: 8080

cloud:
  aws:
    region:
      static: ap-northeast-2
    lambda:
      function-name: test-dummy-function

resume:
  import:
    strategy: lambda

gemini:
  api:
    feature-extraction:
      url: https://generativelanguage.googleapis.com/v1beta
      key: dummy-test-gemini-key

# 임베딩 모델 설정
embedding:
  model:
    url: "djl://ai.djl.huggingface.pytorch/sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
    threshold: 0.75
  cache:
    dir: "${user.home}/.djl-cache"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always