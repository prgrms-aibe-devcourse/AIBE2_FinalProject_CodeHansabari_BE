spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL  # MySQL 호환 모드 추가
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    show-sql: true  # 테스트에서 SQL 로그 보기
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6381
      password: team2
      timeout: 2000ms
  cloud:
    openfeign:
      enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy-test-client-id
            client-secret: dummy-test-client-secret
            scope:
              - openid
              - profile
              - email

jwt:
  secret: test-jwt-secret-for-testing-only-not-for-production-use
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

cookie:
  domain: localhost
  secure: false
  same-site: Lax

app:
  frontend:
    url: http://localhost:3000
  cors:
    allowed-origins:
      - "http://localhost:3000"

llm:
  api:
    url: https://api.openai.com/v1
    cover-letter:
      key: dummy-test-key-cover-letter
    interview:
      key: dummy-test-key-interview
    resume:
      key: dummy-test-key-resume
      vision:
        key: dummy-test-key-vision

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId},%X{spanId},%X{userEmail},%X{responseTime},%X{statusCode}] %logger{36} - %msg%n"
  level:
    com.cvmento: DEBUG
    org.springframework.security: DEBUG
    org.springframework.data.redis: DEBUG

server:
  port: 8080