name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-verification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: CVMento

      - name: Build with Gradle
        run: ./gradlew clean build -Dspring.profiles.active=production -x test
        working-directory: CVMento

      - name: Verify JAR(s)
        run: |
          set -e
          ls -la CVMento/build/libs || true

          # 1) -plain.jar 제외
          CANDIDATES=$(find CVMento/build/libs -maxdepth 1 -type f -name "*.jar" | grep -v -- "-plain" || true)

          # 2) 실행형(MANIFEST에 Start-Class/Main-Class 존재)인 첫 번째 JAR 선택
          JAR=""
          for f in $CANDIDATES; do
            if unzip -p "$f" META-INF/MANIFEST.MF | grep -qE '^(Start-Class:|Main-Class:)'; then
              JAR="$f"
              break
            fi
          done

          if [ -z "$JAR" ]; then
            echo "⛔ No executable JAR found (missing Start-Class/Main-Class)."
            exit 1
          fi

          echo "✅ Executable JAR: $JAR"
          echo "JAR_PATH=$JAR" >> $GITHUB_ENV

      - name: Create source bundle deployment package
        run: |
          mkdir -p deployment-package

          # 소스에서 agent-production.yml 확인
          echo "=== Source file check ==="
          ls -la CVMento/agent-production.yml

          # 모든 파일 복사 (숨겨진 디렉토리 포함)
          cp -r CVMento/. deployment-package/

          # 복사 후 확인
          echo "=== After copy check ==="
          ls -la deployment-package/agent-production.yml

          # 불필요한 파일들 제거
          rm -rf deployment-package/build/
          rm -rf deployment-package/.gradle/
          rm -rf deployment-package/.git/
          rm -rf deployment-package/src/test/

          # 제거 후 다시 확인
          echo "=== After cleanup check ==="
          ls -la deployment-package/agent-production.yml

          # JAR 파일을 application.jar로 복사
          cp ${{ env.JAR_PATH }} deployment-package/application.jar
          
          # 최종 검증: 실행형 JAR인지 확인 (MANIFEST에 Start-Class/Main-Class)
          if ! unzip -p deployment-package/application.jar META-INF/MANIFEST.MF | grep -qE '^(Start-Class:|Main-Class:)'; then
            echo "⛔ application.jar is not executable (MANIFEST missing Start-Class/Main-Class)."
            exit 1
          fi
          echo "✅ application.jar MANIFEST OK"

          # .ebextensions 디렉토리가 있는지 확인
          if [ -d "deployment-package/.ebextensions" ]; then
            echo "✅ .ebextensions directory found"
            ls -la deployment-package/.ebextensions/
          else
            echo "❌ .ebextensions directory not found"
          fi

          echo "Final deployment package contents:"
          find deployment-package -name "agent-production.yml" -o -name "*.config" -o -name "application.jar" | sort

      - name: Create deployment ZIP
        run: |
          cd deployment-package
          zip -r ../cvmento-source-bundle.zip .
          cd ..
          echo "SOURCE_BUNDLE=cvmento-source-bundle.zip" >> $GITHUB_ENV
          
          echo "Source bundle created:"
          ls -lh cvmento-source-bundle.zip

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: cvmento-production
          path: ${{ env.SOURCE_BUNDLE }}
          retention-days: 30